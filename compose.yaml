name: friendly-foodies
services:
  web:
    build:
      context: .
      target: development
    image: friendly-foodies:dev
    working_dir: /app
    init: true
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    restart: unless-stopped

volumes:
  node_modules:
