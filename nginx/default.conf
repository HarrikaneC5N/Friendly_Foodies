server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: a deep link to a place or profile must load React.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Do not cache the HTML shell or service worker forever.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location ~* \.(?:js|css|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
